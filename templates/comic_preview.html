<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Comic</title><style>body{font-family:sans-serif;background:#f9f9f9;padding:20px}.panel{background:white;padding:15px;margin:20px auto;max-width:700px;border-radius:10px;box-shadow:0 4px 10px #0002}img{width:100%;border-radius:8px}.btn{display:block;width:250px;margin:20px auto;padding:12px;background:#2196F3;color:white;text-align:center;border-radius:8px;text-decoration:none}</style></head><body><h1 style="text-align:center">Your Comic - Foxy 🦊</h1><p style="text-align:center">Style: {{info.style}} | {{info.setting}} | {{info.tone}}</p>{% for p in panels %}<div class="panel"><h3>{{p.title}}</h3><img src="{{p.image_url}}"><p>{{p.description}}</p><p style="background:#fff8e1;padding:8px"><b>{{p.dialog}}</b></p></div>{% endfor %}<a href="/download-pdf" class="btn">📥 Download PDF</a><a href="/" class="btn" style="background:#333">⬅️ Back to Home</a></body></html>
